name: Agentic Factory Pipeline

on:
  issues:
    types: [opened, edited]

jobs:
  run-factory:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Factory Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Runtime Core Packages
        run: |
          pip install requests pyyaml groq
          
      - name: Execute Agent Factory Pipeline
        env:
          # FIXED: Pass secrets environment scopes directly into runtime maps
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python .agentic-factory/factory_gateway.py
